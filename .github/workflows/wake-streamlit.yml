name: Wake Streamlit Apps

# Periodically visits the embedded Streamlit dashboards so visitors on
# yoyonline.com are less likely to hit the "app has gone to sleep" screen.
# Best-effort only — see docs/streamlit-wake.md.

on:
  workflow_dispatch:
  schedule:
    # Every 3 hours, on an odd minute to avoid the top-of-hour scheduler crush.
    # Streamlit sleeps apps after 12h without traffic and GitHub often starts
    # scheduled runs hours late (or drops them), so 6h left no safety margin.
    - cron: "17 */3 * * *"

permissions:
  contents: read

# Deliberately no `concurrency` group: if GitHub orphans a queued run
# ("Waiting for a runner to pick up this job..."), a lock holds back every
# later run until someone cancels it. Waking is idempotent, so overlap is fine.

jobs:
  wake:
    name: Wake Streamlit apps
    runs-on: ubuntu-latest
    # Worst case (every app asleep, handled one at a time) is ~30 minutes.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium with dependencies
        run: npx playwright install --with-deps chromium

      - name: Wake Streamlit apps
        run: node scripts/wake-streamlit.mjs
